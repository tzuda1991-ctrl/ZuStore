<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2fbfc"><meta name="description" content="Discover thoughtful apps and games on ZUStore.">
  <title>ZUStore — discover what's next</title>
  <link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="ZUStore home"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span><b>ZU</b>Store<small>SAFE · FAST · INDEPENDENT</small></span></a>
      <div class="top-actions"><button class="icon-btn search-mobile" id="mobileSearch" title="Search">⌕</button><button class="icon-btn" id="notificationsBtn" title="Notifications"><span>♧</span><i class="dot"></i></button><button class="icon-btn" id="settingsBtn" title="Settings">⚙</button><button class="avatar-btn" id="accountBtn"><span id="avatarText">Z</span></button></div>
    </header>
    <div class="search-wrap" id="searchWrap"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="Search apps & games…" autocomplete="off"><button id="clearSearch" aria-label="Clear search">×</button><kbd>⌘ K</kbd></div>
    <main id="mainContent"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
      <button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="apps"><span>▦</span>Apps</button><button data-page="library"><span>⇩</span>My Library</button><button data-page="messages"><span>▤</span>Messages</button><button data-page="profile"><span>◉</span>Profile</button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <script src="/app.js" defer></script>
</body>
</html>
